server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolve the backend on every request through Docker's DNS: with a
        # fixed name nginx keeps the IP from its start, and after the backend
        # container is recreated (update, rebuild) every request fails with 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # With the port: the API compares Origin with Host (src/api/security.py).
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 86400;

        # Video uploads: the API enforces the size limit (API_MAX_UPLOAD_GB)
        # and streams the body to disk, so nginx neither caps it (default 1 MB)
        # nor stores a copy first.
        client_max_body_size 0;
        proxy_request_buffering off;
    }
}
