# Scientific Clips Pipeline Configuration

# Profiles directory
profiles_dir: "config/profiles"

# Input settings
input:
  default_source: ""  # path or URL
  cache_dir: "artifacts/cache"
  
# Preprocessing settings
preprocessing:
  audio_sample_rate: 16000
  audio_channels: 1
  video_max_height: 1080
  video_codec: "h264"
  video_crf: 23
  copy_compatible_video: true  # remux instead of re-encoding 8-bit h264 <= video_max_height
  denoise: false  # Enable audio denoising before transcription
  denoise_method: "afftdn"  # afftdn | rnnoise (afftdn is built-in, rnnoise requires plugin)

# Transcription settings
transcription:
  model: "large-v3-turbo"
  language: "auto"
  batch_size: 8
  compute_type: "float16"
  chunk_duration_min: 30  # minutes
  engine: "faster_whisper"  # faster_whisper | whisper_cpp (GPU on Intel Arc via Vulkan)
  whisper_cpp_binary: "whisper-cli"  # path or name in PATH
  whisper_cpp_model_path: ""  # ggml model, e.g. ggml-large-v3-turbo.bin
  whisper_cpp_threads: 8
  whisper_cpp_beam_size: 4
  whisper_cpp_max_context: 0  # 0 = no text-context carry-over (-1 degrades long chunks into fragments)

# Scoring settings
scoring:
  min_duration: 45
  max_duration: 90
  min_score_threshold: 0.45  # clip score = max of its segments
  max_clips_per_video: 12  # candidates; keep 5-7 of them in review
  term_extraction_method: "keybert"  # or "statistical" (word frequencies, no model)
  strategy: "llm_windows"  # llm_windows (the LLM picks hook-to-conclusion clips) | segment_merge (heuristics + LLM per segment)
  window_sec: 150  # llm_windows: window shown to the LLM (room for 90-s clips)
  window_step_sec: 75
  windows_per_call: 3
  llm:
    enabled: true
    provider: "llama_cpp"  # openai | anthropic | qwen_local | llama_cpp
    model: "Qwen/Qwen3-14B"
    model_repo: "bartowski/Qwen_Qwen3-14B-GGUF"  # HF repo for download
    model_file: "Qwen_Qwen3-14B-Q4_K_M.gguf"      # ~9 GB, Q4_K_M quant
    model_path: "artifacts/cache/models/Qwen_Qwen3-14B-Q4_K_M.gguf"  # project-relative; downloaded here on first run if missing
    api_key: null  # not used for llama_cpp
    api_base: null  # not used for llama_cpp
    temperature: 0.2  # low for reproducible scoring
    seed: 42
    max_tokens: 4000
    prompt_file: "config/prompts/segment_analysis_v1.txt"
    window_prompt_file: "config/prompts/segment_analysis_v3.txt"
    disable_thinking: true  # Qwen3 "/no_think": reasoning took ~40% of tokens
    llm_weight: 0.4  # weight for combining heuristic + LLM scores (0=heuristic only, 1=LLM only)
    max_segments: null  # cap on segments sent to LLM (top heuristic candidates); null = all
    n_ctx: 8192
    n_gpu_layers: -1  # -1 = offload all layers to GPU
    n_batch: 512
    top_p: 0.95
    chat_format: null  # null = auto-detect from GGUF; set "qwen3"/"chatml" to force
    download_if_missing: true  # download the GGUF on first run if model_path is missing
    min_tokens_per_sec: 10.0  # fallback to BERT heuristics below this throughput
    verbose: false
  
# Cropping settings
cropping:
  output_width: 1080
  output_height: 1920
  face_confidence_threshold: 0.6
  moving_average_window: 5
  sample_fps: 1
  shot_size_ratio_threshold: 1.35  # face box size jump = shot/zoom change
  shot_center_jump_threshold: 0.5  # face center jump (share of box width) = cut
  min_track_segment_sec: 2.0  # shorter crop segments merge into a neighbour
  scene_cut_threshold: 10  # ffmpeg scdet: crop switches exactly on shot cuts (0 = off)
  frame_decoder: "auto"  # auto (GPU decode via VAAPI if it works, else CPU) | software | vaapi
  min_reframe_share: 0.25  # no cut: move the window only if the face shifts > 25% of its width

# Rendering settings
rendering:
  audio_loudnorm_i: -14
  audio_loudnorm_tp: -1.5
  audio_loudnorm_lra: 11
  padding_color: "black"
  subtitle_format: "srt"  # sidecar file next to the clip: srt | ass (burn-in always uses ASS)
  subtitle_style: "typewriter"  # typewriter | default | modern | minimal (src/subtitles.py)
  subtitle_style_overrides: {}  # per-field changes, e.g. {box_opacity: 0.6, font_size: 60}
  subtitle_fonts_dir: null  # extra fonts for libass (not registered in fontconfig)
  subtitle_font: "Arial"
  subtitle_fontsize: 48
  subtitle_primary_color: "&H00FFFFFF"
  subtitle_outline_color: "&H00000000"
  subtitle_back_color: "&H80000000"
  video_codec: "h264"
  video_preset: "medium"
  video_encoder: "auto"  # auto (GPU if it works, else CPU) | software | qsv | vaapi | nvenc
  render_timeout_sec: 300

# Chapters settings (for chapters/draft mode)
chapters:
  enabled: false
  min_minutes: 5
  max_minutes: 7
  target_count: null  # exact chapter count; null = model decides (guided by min/max_minutes)
  prompt_file: "config/prompts/chapter_detection_v1.txt"
  output_format: "both"  # json | youtube | both

# B-roll suggestions settings (advisory artifact, generated during chapters/draft mode)
broll:
  enabled: false
  max_suggestions: null  # cap on suggestions; null = model decides
  prompt_file: "config/prompts/broll_suggestions_v1.txt"

# Cleanup settings
cleanup:
  retention_days: 30  # after N days a finished job's source video is removed, clips stay; 0 = never
  max_upload_size_gb: 50  # only a warning in the log

# Output settings
output:
  clips_dir: "output/clips"
  manifest_file: "output/manifest.json"
  review_file: "artifacts/review.json"
  isolated: true
  output_dir_template: "{video_name}_{timestamp}"
  timestamp_format: "%Y-%m-%d_%H-%M-%S"

# Logging settings
logging:
  level: "INFO"
  log_file: "artifacts/logs/pipeline.log"
  json_format: true

# GPU settings
gpu:
  backend: auto
  # whisper_device_override: cpu
  # whisper_compute_override: int8
