# Pinned model weights: the uv.lock of the models.
#
# Every entry fixes the Hugging Face repo revision (commit) a model is
# downloaded from; single-file models also fix the sha256 and size, which
# `just prefetch-models` verifies. A model that is not listed here still
# works, it is just downloaded from the repo's latest revision unverified.
#
# To bump a model: take the new commit and file sha256/size from the repo's
# "Files" page on huggingface.co (or HfApi().model_info(repo,
# files_metadata=True)), update the entry, run `just prefetch-models`.

# Single files: GGUF for llama.cpp, ggml for whisper.cpp.
